<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>My AI Assistant</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f9f7f4;height:100vh;display:flex;flex-direction:column;overflow:hidden}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#d4cfc9;border-radius:4px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#setup{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#fdf6f0,#f5ede4);padding:20px}
.card{background:#fff;border-radius:20px;border:1px solid #e7e5e0;padding:32px 26px;max-width:440px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,.08)}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.logo-icon{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,#c96442,#7c3f2b);display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;flex-shrink:0}
h2{font-size:15px;font-weight:700;color:#1c1917;margin-bottom:5px}
.hint{font-size:13px;color:#78716c;line-height:1.65;margin-bottom:14px}
.hint a{color:#c96442}
label{display:block;font-size:12px;font-weight:600;color:#57534e;margin-bottom:5px;margin-top:12px}
.iw input{width:100%;padding:11px 13px;border:1.5px solid #e7e5e0;border-radius:10px;font-size:13px;font-family:monospace;color:#1c1917;background:#fafaf9;outline:none;transition:border-color .2s}
.iw input:focus{border-color:#c96442}
select{width:100%;padding:11px 13px;border:1.5px solid #e7e5e0;border-radius:10px;font-size:13px;font-family:inherit;color:#1c1917;background:#fafaf9;outline:none;margin-bottom:4px}
.errmsg{background:#fef2f2;border:1px solid #fca5a5;border-radius:8px;padding:10px 13px;font-size:13px;color:#991b1b;margin-bottom:10px;line-height:1.6;white-space:pre-wrap;display:none}
.okmsg{background:#f0fdf4;border:1px solid #86efac;border-radius:8px;padding:10px 13px;font-size:13px;color:#166534;margin-bottom:10px;line-height:1.6;display:none}
.statusmsg{background:#eff6ff;border:1px solid #93c5fd;border-radius:8px;padding:8px 13px;font-size:12px;color:#1e40af;margin-bottom:8px;display:none}
.pbtn{width:100%;padding:13px;background:#1c1917;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:6px;transition:all .2s}
.pbtn:disabled{background:#e7e5e0;color:#a8a29e;cursor:not-allowed}
.gbtn{background:#166534}
#chat{display:none;flex-direction:column;height:100vh}
#hdr{display:flex;align-items:center;gap:10px;padding:11px 18px;border-bottom:1px solid #f0ede8;background:#fff;flex-shrink:0}
#ctitle{font-size:14px;font-weight:600;color:#1c1917;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mbadge{font-size:10px;background:#f0ede8;color:#9a3412;padding:3px 9px;border-radius:10px;font-weight:600;font-family:monospace;white-space:nowrap}
.hb{background:none;border:1px solid #e7e5e0;border-radius:7px;padding:5px 9px;cursor:pointer;font-size:13px;color:#78716c;white-space:nowrap}
#msgs{flex:1;overflow-y:auto;padding:24px 0}
#inner{max-width:720px;margin:0 auto;padding:0 18px}
.welcome{display:flex;flex-direction:column;align-items:center;gap:22px;padding:40px 20px;min-height:60vh}
.wi{width:58px;height:58px;border-radius:16px;background:linear-gradient(135deg,#c96442,#7c3f2b);display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;box-shadow:0 4px 20px rgba(201,100,66,.25)}
.wt{font-size:24px;font-weight:800;color:#1c1917;letter-spacing:-.03em;text-align:center}
.ws{font-size:14px;color:#78716c;max-width:300px;line-height:1.7;text-align:center}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:460px;width:100%}
.chip{background:#fafaf9;border:1px solid #e7e5e0;border-radius:10px;padding:12px 13px;cursor:pointer;font-size:12px;color:#44403c;font-family:inherit;text-align:left;line-height:1.5}
.chip:hover{background:#f0ede8}
.mrow{display:flex;gap:12px;margin-bottom:24px;animation:fadein .3s ease}
.mrow.u{flex-direction:row-reverse}
.av{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#c96442,#7c3f2b);display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;flex-shrink:0;margin-top:2px}
.bw{flex:1;min-width:0}
.bw.uw{flex:none;max-width:78%}
.lbl{font-size:12px;font-weight:600;color:#78716c;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.dot{width:6px;height:6px;border-radius:50%;background:#c96442;display:inline-block;animation:spin 1s ease-in-out infinite}
.ububble{background:#1c1917;color:#fafaf9;padding:11px 16px;border-radius:16px 16px 4px 16px;font-size:15px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.aic{font-size:15px;color:#1c1917;line-height:1.8}
.aic h1{font-size:21px;font-weight:800;margin:20px 0 8px}
.aic h2{font-size:17px;font-weight:700;margin:18px 0 6px;border-bottom:1px solid #e7e5e0;padding-bottom:4px}
.aic h3{font-size:15px;font-weight:700;margin:14px 0 4px}
.aic li{margin:3px 0 3px 18px;line-height:1.7}
.aic code{background:#f0ede8;padding:2px 6px;border-radius:4px;font-family:monospace;font-size:.85em;color:#9a3412}
.cb{margin:12px 0;border-radius:10px;overflow:hidden;border:1px solid #1e2030}
.ch{background:#1a1b26;padding:7px 14px;display:flex;justify-content:space-between;align-items:center}
.cl{color:#7aa2f7;font-family:monospace;font-size:11px}
.cpb{background:none;border:1px solid #2a2f45;border-radius:4px;color:#565f89;cursor:pointer;font-size:11px;padding:2px 9px}
.cpr{background:#0f1117;padding:16px;overflow-x:auto;margin:0;line-height:1.7;color:#cdd6f4;font-family:monospace;font-size:13px}
#ia{padding:12px 18px 18px;flex-shrink:0;max-width:720px;width:100%;margin:0 auto}
.ib{display:flex;gap:8px;background:#fff;border:1.5px solid #e7e5e0;border-radius:14px;padding:10px 12px;box-shadow:0 1px 4px rgba(0,0,0,.06);align-items:flex-end}
.ib:focus-within{border-color:#c9b8a0}
#mi{flex:1;background:none;border:none;outline:none;resize:none;font-size:15px;line-height:1.6;color:#1c1917;font-family:inherit;max-height:160px;overflow-y:auto}
#mi::placeholder{color:#c4b9b0}
#sb{width:36px;height:36px;border-radius:9px;border:none;background:#e7e5e0;color:#a8a29e;cursor:not-allowed;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
#sb.on{background:#1c1917;color:#fff;cursor:pointer}
.fn{text-align:center;font-size:11px;color:#c4b9b0;margin-top:7px}
.sp{width:16px;height:16px;border:2px solid #a8a29e;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
</style>
</head>
<body>

<div id="setup">
  <div class="card">
    <div class="logo">
      <div class="logo-icon">✦</div>
      <div>
        <div style="font-size:19px;font-weight:800;color:#1c1917;letter-spacing:-.03em">My AI Assistant</div>
        <div style="font-size:12px;color:#a8a29e">Personal senior developer AI</div>
      </div>
    </div>
    <h2>One-time setup</h2>
    <p class="hint">Enter your Cloudflare Worker URL. Your API key is stored securely in your Worker — not in this app.</p>

    <label>Your Cloudflare Worker URL</label>
    <div class="iw"><input type="text" id="wurl" placeholder="https://my-ai-app.htwoodward.workers.dev" oninput="onIn()"/></div>

    <label>Model</label>
    <select id="mdl">
      <option value="claude-sonnet-4-6">Claude Sonnet 4 — best quality ✦</option>
      <option value="claude-haiku-4-5-20251001">Claude Haiku 4.5 — fast &amp; cheap ⚡</option>
      <option value="claude-opus-4-6">Claude Opus 4 — most powerful 🧠</option>
      <option value="claude-3-5-sonnet-20241022">Claude 3.5 Sonnet (legacy)</option>
      <option value="claude-3-haiku-20240307">Claude 3 Haiku (legacy)</option>
    </select>

    <div class="errmsg" id="em"></div>
    <div class="okmsg" id="ok"></div>
    <div class="statusmsg" id="sm"></div>

    <button class="pbtn" id="tbtn" onclick="doTest()" disabled>▶ Test Connection</button>
    <button class="pbtn gbtn" id="sbtn" onclick="doSave()" style="display:none">✓ Save &amp; Start Chatting</button>
  </div>
</div>

<div id="chat">
  <div id="hdr">
    <span id="ctitle">My AI Assistant</span>
    <span id="mbadge">Claude</span>
    <button class="hb" onclick="doReset()">⚙️ Settings</button>
    <button class="hb" onclick="doNew()">✏️ New</button>
  </div>
  <div id="msgs"><div id="inner"></div></div>
  <div id="ia">
    <div class="ib">
      <textarea id="mi" rows="1" placeholder="Ask me to build an app, solve a problem, write code…"
        oninput="ar(this);us()" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();go();}"></textarea>
      <button id="sb" onclick="go()">↑</button>
    </div>
    <div class="fn">Your personal senior dev AI · Powered by Claude</div>
  </div>
</div>

<script>
var WURL='',MODEL='claude-sonnet-4-6',HIST=[],BUSY=false;
var CHIPS=['Build a weather app','Create a habit tracker','Write a snake game','Make a budget calculator','Build a landing page','Create a quiz app'];
var SYSTEM='You are a brilliant senior full-stack developer and product strategist acting as a personal AI assistant. Your user is an entrepreneur with great ideas but minimal coding experience. Your job is to:\n- Turn their ideas into real working apps and code\n- Explain technical concepts in plain English, never condescending\n- Always produce complete, copy-paste-ready code that works immediately\n- When asked to build something, produce a single complete self-contained HTML file with all CSS and JS inline\n- Be concise but thorough. No filler. High signal.';

window.onload=function(){
  WURL=localStorage.getItem('_wurl')||'';
  MODEL=localStorage.getItem('_model')||'claude-sonnet-4-6';
  if(WURL){showChat();}
};

function onIn(){
  var v=document.getElementById('wurl').value.trim();
  document.getElementById('tbtn').disabled=!v.startsWith('https://');
  document.getElementById('em').style.display='none';
  document.getElementById('ok').style.display='none';
  document.getElementById('sbtn').style.display='none';
}

function se(m){var e=document.getElementById('em');e.textContent=m;e.style.display=m?'block':'none';}
function so(m){var e=document.getElementById('ok');e.textContent=m;e.style.display=m?'block':'none';}
function ss(m){var e=document.getElementById('sm');e.textContent=m;e.style.display=m?'block':'none';}

async function doTest(){
  var url=document.getElementById('wurl').value.trim();
  var mdl=document.getElementById('mdl').value;
  var btn=document.getElementById('tbtn');
  btn.disabled=true;btn.textContent='⏳ Testing…';
  se('');so('');ss('Connecting to Worker…');
  try{
    var res=await fetch(url,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:mdl,max_tokens:20,messages:[{role:'user',content:'Reply with only: CONNECTED'}]})
    });
    var raw=await res.text();
    ss('');
    if(!raw||!raw.trim()){se('Worker returned empty response.\nMake sure ANTHROPIC_API_KEY is saved in Cloudflare → Settings → Variables.');btn.disabled=false;btn.textContent='▶ Test Connection';return;}
    var data;
    try{data=JSON.parse(raw);}catch(e){se('Unexpected response from Worker:\n'+raw.slice(0,200));btn.disabled=false;btn.textContent='▶ Test Connection';return;}
    if(data.error){
      var msg=data.error.message||'';
      var typ=data.error.type||'';
      if(typ==='not_found_error'){
        se('Model "'+mdl+'" not found on your account.\nTry selecting a different model from the dropdown above.');
      } else if(typ==='authentication_error'){
        se('Invalid API key in your Worker.\nGo to Cloudflare → my-ai-app → Settings → Variables and re-enter your ANTHROPIC_API_KEY.');
      } else {
        se('API error ('+typ+'): '+msg);
      }
    } else {
      var reply=(data.content&&data.content[0]&&data.content[0].text)||'';
      so('✅ Connected! Claude replied: "'+reply.trim()+'"');
      document.getElementById('sbtn').style.display='block';
      WURL=url;MODEL=mdl;
    }
  }catch(e){
    ss('');
    se('Cannot reach Worker: '+e.message+'\nCheck the URL is correct.');
  }
  btn.disabled=false;btn.textContent='▶ Test Connection';
}

function doSave(){
  localStorage.setItem('_wurl',WURL);
  localStorage.setItem('_model',MODEL);
  showChat();
}

function showChat(){
  document.getElementById('setup').style.display='none';
  document.getElementById('chat').style.display='flex';
  document.getElementById('mbadge').textContent=MODEL;
  doNew();
}

function doReset(){
  document.getElementById('chat').style.display='none';
  document.getElementById('setup').style.display='flex';
  document.getElementById('wurl').value=WURL;
  document.getElementById('em').style.display='none';
  document.getElementById('ok').style.display='none';
  document.getElementById('sbtn').style.display='none';
}

function doNew(){
  HIST=[];
  var inner=document.getElementById('inner');inner.innerHTML='';
  var w=document.createElement('div');w.className='welcome';
  w.innerHTML='<div class="wi">✦</div><div><div class="wt">Your Personal AI</div><div class="ws">Senior developer + product strategist. Build apps, solve problems, ship ideas.</div></div><div class="chips" id="cr"></div>';
  inner.appendChild(w);
  CHIPS.forEach(function(c){var b=document.createElement('button');b.className='chip';b.textContent=c;b.onclick=function(){go(c);};document.getElementById('cr').appendChild(b);});
  document.getElementById('ctitle').textContent='My AI Assistant';
}

function ar(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,160)+'px';}
function us(){var v=document.getElementById('mi').value.trim();document.getElementById('sb').className=v&&!BUSY?'on':'';}

function rmk(t){
  t=t.replace(/```(\w*)\n?([\s\S]*?)```/g,function(_,l,c){
    var id='c'+Math.random().toString(36).slice(2,7);
    var e=c.trim().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return '<div class="cb"><div class="ch"><span class="cl">'+(l||'code')+'</span><button class="cpb" onclick="navigator.clipboard.writeText(document.getElementById(\''+id+'\').textContent)">Copy</button></div><pre class="cpr"><code id="'+id+'">'+e+'</code></pre></div>';
  });
  t=t.replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>');
  t=t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');
  t=t.replace(/`([^`]+)`/g,'<code>$1</code>');
  t=t.replace(/^[-*] (.+)$/gm,'<li>$1</li>').replace(/^(\d+)\. (.+)$/gm,'<li>$2</li>');
  return t.replace(/\n\n/g,'<br/><br/>').replace(/\n/g,'<br/>');
}

function addMsg(role,content){
  var w=document.querySelector('.welcome');if(w)w.remove();
  var row=document.createElement('div');row.className='mrow'+(role==='user'?' u':'');
  if(role==='user'){
    row.innerHTML='<div class="bw uw"><div class="ububble">'+content.replace(/</g,'&lt;')+'</div></div>';
  }else{
    row.innerHTML='<div class="av">✦</div><div class="bw"><div class="lbl">Assistant <span class="dot" id="ddot"></span></div><div class="aic" id="aist"></div></div>';
  }
  document.getElementById('inner').appendChild(row);
  row.scrollIntoView({behavior:'smooth',block:'end'});
}

async function go(text){
  var mi=document.getElementById('mi');
  var t=(text||mi.value).trim();
  if(!t||BUSY)return;
  mi.value='';mi.style.height='auto';us();
  if(document.getElementById('ctitle').textContent==='My AI Assistant')document.getElementById('ctitle').textContent=t.slice(0,40);
  HIST.push({role:'user',content:t});
  addMsg('user',t);
  BUSY=true;
  var sb=document.getElementById('sb');sb.innerHTML='<div class="sp"></div>';sb.className='';
  addMsg('assistant','');
  var aist=document.getElementById('aist');
  try{
    var res=await fetch(WURL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:MODEL,max_tokens:3000,system:SYSTEM,messages:HIST})});
    var data=await res.json();
    if(data.error)throw new Error(data.error.message||'API error');
    var reply=data.content&&data.content[0]&&data.content[0].text||'No response';
    HIST.push({role:'assistant',content:reply});
    var i=0;
    var tick=setInterval(function(){
      i+=8;aist.innerHTML=rmk(reply.slice(0,i));
      aist.scrollIntoView({behavior:'smooth',block:'end'});
      if(i>=reply.length){clearInterval(tick);var d=document.getElementById('ddot');if(d)d.remove();BUSY=false;sb.textContent='↑';us();}
    },10);
  }catch(e){
    aist.innerHTML='<span style="color:#ef4444">⚠️ '+e.message+'</span>';
    var d=document.getElementById('ddot');if(d)d.remove();BUSY=false;sb.textContent='↑';us();
  }
}
</script>
</body>
</html>
